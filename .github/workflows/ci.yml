name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference-suites:
    # A runner here has no GPU, so the six suites below are the ones that touch
    # the reference machine, the decode tables and the toolchain only: they
    # import the circuit modules without launching kernels. The circuit suites
    # themselves stay gated by the local battery, which owns a device.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton --no-deps
      - name: run the GPU-free suites
        run: |
          python3 -m pytest -q test_arithmetic_bounds.py test_asm_strictness.py \
            test_debug_resume.py test_form_domain.py test_isa_v2.py test_linking.py
